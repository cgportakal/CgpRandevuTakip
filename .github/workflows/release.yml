name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Sürüm (v öneki olmadan, ör. 1.6.1)'
        required: true
        type: string
      publish:
        description: 'GitHub Release oluştur ve assetleri yükle'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') {
            '${{ inputs.version }}'.Trim().TrimStart('v')
          } else {
            '${{ github.ref_name }}'.TrimStart('v')
          }

          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z\.\-]+)?$') {
            throw "Geçersiz sürüm: '$version'"
          }

          $source = Get-Content 'src/CgpRandevuTakip.Domain/Common/AppConstants.cs' -Raw
          $match = [regex]::Match($source, 'Version\s*=\s*"([^"]+)"')
          if (-not $match.Success) { throw 'AppConstants.Version bulunamadı.' }

          $declared = $match.Groups[1].Value
          if ($declared -ne $version) {
            throw "Sürüm uyuşmuyor: tag=$version, AppConstants=$declared. Önce sürümü güncelleyin."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$($version.Contains('-').ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore CgpRandevuTakip.sln

      - name: Build (Release)
        run: dotnet build CgpRandevuTakip.sln -c Release --no-restore

      - name: Test (Release)
        run: dotnet test CgpRandevuTakip.sln -c Release --no-build --logger "trx;LogFileName=release-tests.trx" --results-directory TestResults

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Prepare signing certificate
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'signing.pfx'
          if (-not [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64)) {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))

            $secure = if ([string]::IsNullOrEmpty($env:SIGNING_PFX_PASSWORD)) {
              New-Object System.Security.SecureString
            } else {
              ConvertTo-SecureString $env:SIGNING_PFX_PASSWORD -AsPlainText -Force
            }

            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $secure
            Set-Content -Path 'signing.thumbprint' -Value $cert.Thumbprint -Encoding ASCII

            New-Item -ItemType Directory -Force -Path dist | Out-Null
            Export-Certificate -Cert $cert -FilePath (Join-Path 'dist' 'CGP-RandevuTakip-Dev.cer') -Type CERT | Out-Null
            Write-Host 'CA/üretim sertifikası içe aktarıldı.'
          } else {
            Write-Host 'Sertifika secret yok; geliştirme (self-signed) sertifikası üretilecek.'
            ./Imza-Sertifikasi-Olustur.ps1
          }

      - name: Build installer
        shell: pwsh
        run: |
          ./Kurulum-Olustur.ps1 -Version '${{ steps.version.outputs.version }}' -Portable

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ steps.version.outputs.version }}
          path: |
            dist/CGP-RandevuTakip-*.exe
            dist/CGP-RandevuTakip-*.zip
            dist/SHA256SUMS.txt
            dist/CGP-RandevuTakip-Dev.cer
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $tag = "v$version"
          $files = @(
            "dist/CGP-RandevuTakip-$version-Setup.exe",
            "dist/CGP-RandevuTakip-$version-portable.zip",
            "dist/SHA256SUMS.txt"
          )
          $cer = 'dist/CGP-RandevuTakip-Dev.cer'
          if (Test-Path $cer) { $files += $cer }

          $existing = gh release view $tag --json tagName 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing) {
            gh release upload $tag @files --clobber
          } else {
            $releaseArgs = @(
              $tag,
              '--title', "CGP - Randevu Takip $version",
              '--generate-notes'
            )

            if ('${{ github.event_name }}' -eq 'push') {
              $releaseArgs += '--verify-tag'
            } else {
              $releaseArgs += '--target'
              $releaseArgs += '${{ github.sha }}'
            }

            if ('${{ steps.version.outputs.prerelease }}' -eq 'true') {
              $releaseArgs += '--prerelease'
            }
            gh release create @releaseArgs @files
          }

      - name: Summary
        shell: pwsh
        run: |
          Get-ChildItem dist -File | Select-Object Name, Length |
            Format-Table -AutoSize | Out-String | Write-Host
