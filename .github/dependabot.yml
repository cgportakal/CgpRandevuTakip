version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      dotnet-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # net8.0 hedefi nedeniyle major sürüm atlamaları net10 geçişine kadar kapalı.
    # Swashbuckle 10.3.1 net8 ile uyumlu; 11.x net10, Hosting/ProtectedData 11.x
    # de net10 gerektirdiği için bu paketlerin major bump'ları bilinçli olarak beklemede.
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
